name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run full workspace test suite
        run: cargo test --workspace --all-targets --locked

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable toolchain with rustfmt and clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run clippy with warnings denied
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Run web unit tests
        run: npm test

      - name: Type-check and build the embedded console
        run: npm run build

  sdk-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Cache Cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            bindings/python/target
          key: ubuntu-sdk-${{ hashFiles('**/Cargo.lock') }}

      - name: Build mem and mem-daemon binaries
        run: |
          npm --prefix web ci
          npm --prefix web run build
          cargo build --release --locked -p mem-cli -p mem-daemon -p mem-fuse

      - name: Build Python PyO3 native extension & run unit tests
        run: |
          cargo build --release --manifest-path bindings/python/Cargo.toml
          cp bindings/python/target/release/lib_native.so bindings/python/python/engram/_native.so
          PYTHONPATH=bindings/python/python MEM_DAEMON_BIN=$PWD/target/release/mem-daemon python3 -m unittest discover -s bindings/python/tests -v

      - name: Run TypeScript SDK integration tests
        run: |
          MEM_BIN=$PWD/target/release/mem MEM_DAEMON_BIN=$PWD/target/release/mem-daemon node --test bindings/typescript/tests/sdk.test.ts
