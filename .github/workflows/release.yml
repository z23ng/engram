name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain & target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux ARM64 cross-compiler
        if: matrix.cross == true
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build mem release binary
        env:
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          AR_aarch64_unknown_linux_gnu: aarch64-linux-gnu-ar
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --locked --target ${{ matrix.target }} -p mem-cli

      - name: Package Unix archive & SHA256
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/mem" dist/mem
          chmod +x dist/mem
          tar -C dist -czf "mem-${{ matrix.target }}.tar.gz" mem
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "mem-${{ matrix.target }}.tar.gz" > "mem-${{ matrix.target }}.tar.gz.sha256"
          else
            shasum -a 256 "mem-${{ matrix.target }}.tar.gz" > "mem-${{ matrix.target }}.tar.gz.sha256"
          fi

      - name: Package Windows archive & SHA256
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target\${{ matrix.target }}\release\mem.exe" "dist\mem.exe"
          Compress-Archive -Path "dist\mem.exe" -DestinationPath "mem-${{ matrix.target }}.zip"
          $hash = (Get-FileHash "mem-${{ matrix.target }}.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  mem-${{ matrix.target }}.zip" | Out-File -Encoding ascii "mem-${{ matrix.target }}.zip.sha256"

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            mem-*.tar.gz
            mem-*.tar.gz.sha256
            mem-*.zip
            mem-*.zip.sha256

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*
