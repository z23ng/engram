services:
  mem:
    build: .
    container_name: ai-memory
    environment:
      MEM_DB_PATH: /data/memory.db
      # Switch between: ollama | openai | disabled
      MEM_PROVIDER: ${MEM_PROVIDER:-disabled}
      MEM_EMBEDDING_BASE_URL: ${MEM_EMBEDDING_BASE_URL:-http://ollama:11434/v1}
      MEM_EMBEDDING_MODEL: ${MEM_EMBEDDING_MODEL:-bge-m3}
      MEM_EMBEDDING_DIMENSIONS: ${MEM_EMBEDDING_DIMENSIONS:-1024}
      MEM_LLM_BASE_URL: ${MEM_LLM_BASE_URL:-http://ollama:11434/v1}
      MEM_LLM_MODEL: ${MEM_LLM_MODEL:-qwen2.5:7b}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      MEM_DAEMON_HOST: 0.0.0.0
      MEM_DAEMON_PORT: "7700"
      MEM_DAEMON_TOKEN: ${MEM_DAEMON_TOKEN:-}
    ports:
      - "7700:7700"
    volumes:
      - mem_data:/data
    stdin_open: true
    tty: true
    # Starts HTTP REST / SSE / HTTP-SSE MCP daemon on :7700; override with `doctor` or `mcp` if desired
    command: ["daemon", "--host", "0.0.0.0", "--port", "7700"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:7700/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # Optional local Ollama service: start with `docker compose --profile ollama up`
  ollama:
    image: ollama/ollama:latest
    container_name: ai-memory-ollama
    profiles: ["ollama"]
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  mem_data:
  ollama_data:
