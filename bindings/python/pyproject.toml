[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "engram"
version = "0.2.0"
description = "Versioned structured memory engine for AI agents (SQLite BLAKE3 CAS + Merkle Tree + Obsidian Wiki Graph)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT OR Apache-2.0" }
keywords = ["ai", "memory", "agents", "langgraph", "sqlite", "merkle-tree"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "License :: OSI Approved :: Apache Software License",
]
dependencies = []

[tool.maturin]
python-source = "python"
module-name = "engram._native"
features = ["pyo3/extension-module"]
