[workspace]
resolver = "2"
members = [
    "crates/mem-core",
    "crates/mem-store",
    "crates/mem-vcs",
    "crates/mem-search",
    "crates/mem-mcp",
    "crates/mem-server",
    "crates/mem-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["z23ng <z23ng@users.noreply.github.com>"]
repository = "https://github.com/z23ng/engram"
documentation = "https://github.com/z23ng/engram/blob/main/docs/USER_GUIDE.md"
keywords = ["ai", "memory", "mcp", "sqlite", "merkle-tree"]
categories = ["database-implementations", "command-line-utilities"]

[workspace.dependencies]
blake3 = "1.5"
zstd = "0.13"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
tempfile = "3.10"
mem-core = { path = "crates/mem-core" }
mem-store = { path = "crates/mem-store" }
mem-vcs = { path = "crates/mem-vcs" }
mem-search = { path = "crates/mem-search" }
mem-mcp = { path = "crates/mem-mcp" }
mem-server = { path = "crates/mem-server" }
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "net"] }
axum = "0.8.9"
base64 = "0.22.1"
bytes = "1.12"
futures-util = "0.3"
dav-server = { version = "0.12.0", default-features = false }
getrandom = "0.4.3"
rust-embed = { version = "8.14.0", features = ["mime-guess"] }
tower = { version = "0.5.3", features = ["util"] }
