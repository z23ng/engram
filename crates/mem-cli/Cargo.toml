[package]
name = "mem-cli"
description = "Unified CLI, interactive onboarding wizard, diagnostics, and stdio MCP server for Engram"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "mem"
path = "src/main.rs"

[dependencies]
chrono = { workspace = true }
mem-core = { workspace = true }
mem-mcp = { workspace = true }
mem-search = { workspace = true }
mem-server = { workspace = true }
mem-store = { workspace = true }
mem-vcs = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["signal"] }

[dev-dependencies]
rusqlite = { workspace = true }
tempfile = { workspace = true }
